# Plan and apply lc-exposure's infrastructure from main, with no stored secret:
# GitHub signs a token for this run (OIDC), and Entra ID trusts it for this
# repository's main branch only (infra/oidc.tf). The ids are variables, not
# secrets: an id says who, it proves nothing.
name: terraform
on:
  push:
    branches: [main]
permissions:
  id-token: write # ask GitHub for the run's OIDC token
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2 # exchanges the token: no client secret
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }} # id-tradefin-deploy
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
      - run: terraform init -input=false -backend-config=envs/dev.backend.hcl
      - run: terraform plan -input=false -var-file=envs/dev.tfvars -out=tfplan
      - run: terraform apply -input=false tfplan
