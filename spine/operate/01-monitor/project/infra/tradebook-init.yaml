#cloud-config
# TradeBook's server, first boot: PostgreSQL, a login for Data Factory that
# may only read, and the desk's data as it stood at batch 41.
package_update: true
packages: [postgresql]
write_files:
%{ for name, path in files ~}
  - path: /opt/tradebook/${name}
    encoding: gz+b64
    permissions: "0644"
    content: ${base64gzip(file(path))}
%{ endfor ~}
runcmd:
  - |
    set -e
    conf=$(ls -d /etc/postgresql/*/main)
    echo "listen_addresses = '*'" >> $conf/postgresql.conf
    echo "host tradebook adf 10.10.0.0/16 scram-sha-256" >> $conf/pg_hba.conf
    systemctl restart postgresql
    cd /opt/tradebook
    sudo -u postgres createdb tradebook
    sudo -u postgres psql -q -d tradebook -f schema.sql -f load.sql
    sql="sudo -u postgres psql -q -d tradebook -c"
    $sql "CREATE ROLE adf LOGIN PASSWORD '${password}'"
    $sql "GRANT SELECT ON ALL TABLES IN SCHEMA public TO adf"
